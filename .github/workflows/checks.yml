name: checks

# Только проверки для PR. Сборку и публикацию в timeweb-dist / timeweb-docker делает deploy-dist.yml.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: check-site
        run: node scripts/check-site.js
      - name: build-dist
        run: node scripts/build-dist.js
      - name: Проверка dist
        run: |
          test -f dist/404.html && test -f dist/index.html
          ! test -e dist/scripts && ! test -e dist/CLAUDE.md && ! test -e dist/drafts
